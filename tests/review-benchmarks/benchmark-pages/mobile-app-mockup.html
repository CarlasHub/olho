<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark - Mobile App Mock-up</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #dfe7ec; font: 14px/1.35 Inter, system-ui, sans-serif; }
    .phone { width: 390px; height: 780px; border-radius: 38px; background: #f8fafc; box-shadow: 0 32px 80px rgba(0,0,0,.22); padding: 22px; overflow: hidden; }
    h1 { font-size: 24px; margin: 28px 0 10px; }
    .hero { height: 210px; border-radius: 28px; background: linear-gradient(135deg, #0d5d74, #74c6db); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .stat { background: white; border-radius: 22px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); }
    .nav { position: absolute; margin-top: 70px; width: 346px; display: flex; justify-content: space-around; background: #ffffff; border-radius: 24px; padding: 12px; }
    .nav button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: #dce3ed; }
  </style>
</head>
<body>
  <main class="phone" data-benchmark-id="mobile-app-mockup" data-intentional-issues="small-targets, decorative-competition, dense-cards">
    <h1>Today</h1><p>Track your route quality and alerts.</p><div class="hero" data-expected-region="mobile-hero"></div>
    <section class="stats" data-expected-region="mobile-stat-cards"><div class="stat">Stops<br><b>18</b></div><div class="stat">Delay<br><b>24m</b></div><div class="stat">Risk<br><b>High</b></div><div class="stat">Tasks<br><b>9</b></div></section>
    <nav class="nav"><button></button><button></button><button></button><button></button></nav>
  </main>
</body>
</html>
