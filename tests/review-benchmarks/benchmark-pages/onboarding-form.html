<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark - Onboarding Form</title>
  <style>
    body { margin: 0; font: 15px/1.35 Inter, system-ui, sans-serif; background: #f8fafc; color: #1f2937; }
    main { width: min(760px, calc(100% - 48px)); margin: 48px auto; background: white; border-radius: 18px; padding: 28px; box-shadow: 0 20px 50px rgba(31,41,55,.12); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #6b7280; }
    label { display: block; margin-top: 16px; font-weight: 700; }
    input, select { width: 100%; height: 36px; border: 1px solid #ccd3df; border-radius: 6px; margin-top: 4px; }
    .error { color: #d65f5f; font-size: 12px; }
    .actions { display: flex; justify-content: space-between; margin-top: 22px; }
    .primary, .secondary { border: 1px solid #d0d7e2; border-radius: 8px; height: 38px; padding: 0 18px; font-weight: 700; background: white; color: #374151; }
  </style>
</head>
<body>
  <main data-benchmark-id="onboarding-form" data-intentional-issues="weak-error-visibility, competing-actions, unclear-flow">
    <h1>Set up your workspace</h1>
    <p>Complete the fields below so your team can start reviewing workflows.</p>
    <label>Company name<input value=""></label><span class="error">Required</span>
    <label>Team size<select><option>Select team size</option></select></label>
    <label>Primary workflow<input value="Design quality review"></label>
    <div class="actions" data-expected-region="form-actions"><button class="secondary">Skip for now</button><button class="primary">Continue</button></div>
  </main>
</body>
</html>
