<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark - Marketing Hero</title>
  <style>
    body { margin: 0; font: 16px/1.45 Inter, system-ui, sans-serif; color: #17202a; background: #f3f7f8; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 48px; }
    .hero { width: min(1120px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
    .copy { background: #eef7f4; border-radius: 28px; padding: 48px; box-shadow: 0 24px 60px rgba(16, 74, 72, .18); }
    h1 { font-size: 42px; line-height: 1.08; margin: 0 0 18px; }
    p { color: #6f7d84; max-width: 54ch; }
    .actions { display: flex; gap: 14px; margin-top: 28px; }
    .action { border: 0; border-radius: 999px; padding: 14px 24px; font-weight: 700; }
    .primary { background: #d8293f; color: white; }
    .secondary { background: #dfe8ea; color: #17202a; box-shadow: 0 10px 30px rgba(0,0,0,.14); }
    .visual { min-height: 460px; border-radius: 36px; background: linear-gradient(135deg, #0d5572, #71bed1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  </style>
</head>
<body>
  <main data-benchmark-id="marketing-hero" data-intentional-issues="competing-visual, weak-cta-path, soft-body-copy">
    <section class="hero">
      <div class="copy" data-expected-region="hero-copy">
        <h1>Operate every launch from one connected workspace</h1>
        <p>Plan releases, review design quality, align stakeholders, track risks, and prepare enterprise teams with one visual operating layer.</p>
        <div class="actions" data-expected-region="cta-group">
          <button class="action primary">Start review</button>
          <button class="action secondary">Explore workflow</button>
        </div>
      </div>
      <div class="visual" data-expected-region="hero-image"></div>
    </section>
  </main>
</body>
</html>
