<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark - Pricing Page</title>
  <style>
    body { margin: 0; font: 15px/1.45 Inter, system-ui, sans-serif; background: #f7f8fb; color: #1f2937; }
    main { padding: 54px; }
    h1 { text-align: center; font-size: 36px; margin: 0 0 26px; }
    .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .plan { background: #fff; padding: 24px; border: 1px solid #dce2eb; border-radius: 10px; box-shadow: 0 12px 36px rgba(0,0,0,.10); }
    .plan:nth-child(2) { border-radius: 28px; box-shadow: 0 22px 70px rgba(34,95,170,.24); }
    .price { font-size: 34px; font-weight: 800; }
    button { width: 100%; height: 42px; margin-top: 16px; border-radius: 8px; border: 1px solid #ccd3dd; font-weight: 800; background: white; color: #1f2937; }
    .plan:nth-child(2) button { background: #245cc7; color: white; border-radius: 999px; }
  </style>
</head>
<body>
  <main data-benchmark-id="pricing-page" data-intentional-issues="inconsistent-cards, inconsistent-cta, weak-plan-priority">
    <h1>Choose the plan for your review team</h1>
    <section class="plans" data-expected-region="pricing-cards">
      <article class="plan"><h2>Starter</h2><p class="price">$19</p><p>For small teams.</p><button>Start trial</button></article>
      <article class="plan"><h2>Growth</h2><p class="price">$49</p><p>For product teams.</p><button>Start trial</button></article>
      <article class="plan"><h2>Enterprise</h2><p class="price">Custom</p><p>For governance.</p><button>Contact sales</button></article>
    </section>
  </main>
</body>
</html>
