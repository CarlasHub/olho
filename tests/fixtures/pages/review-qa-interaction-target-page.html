<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA Interaction Target Page</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f6f8;
        color: #17212b;
        font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px;
      }

      .panel {
        display: grid;
        gap: 22px;
        padding: 30px;
        border-radius: 18px;
        background: #ffffff;
      }

      h1 {
        margin: 0;
      }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tiny-action {
        width: 26px;
        height: 26px;
        border: 1px solid #cbd5df;
        border-radius: 50%;
        background: #ffffff;
        color: #52616f;
        font-weight: 900;
      }

      .link-row {
        display: flex;
        gap: 18px;
      }

      .link-row a {
        color: #0f766e;
        font-weight: 700;
      }

      .form {
        display: grid;
        max-width: 520px;
        gap: 10px;
      }

      input,
      select {
        min-height: 34px;
        border: 1px solid #d6dee7;
        border-radius: 8px;
        padding: 6px 8px;
      }

      input:focus,
      select:focus,
      button:focus {
        outline: none;
        box-shadow: none;
      }

      .error {
        padding: 8px 10px;
        border-radius: 8px;
        background: #fff1f2;
        color: #d99a9d;
        font-size: 12px;
      }

      .status-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .status {
        padding: 16px;
        border-radius: 14px;
        background: #f8fafc;
      }

      .status span {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 8px;
        border-radius: 50%;
      }

      .red {
        background: #ef4444;
      }

      .green {
        background: #22c55e;
      }

      .yellow {
        background: #f59e0b;
      }
    </style>
  </head>
  <body>
    <!-- QA expected: small targets, colour-only status, weak focus visibility, weak error visibility. -->
    <main class="shell" data-review-fixture="interaction-target-page">
      <section class="panel">
        <h1>Interaction review surface</h1>
        <div class="action-row" data-expected-issue="small-touch-targets">
          <button class="tiny-action" type="button" aria-label="Pin">P</button>
          <button class="tiny-action" type="button" aria-label="Share">S</button>
          <button class="tiny-action" type="button" aria-label="More">M</button>
        </div>
        <nav class="link-row" aria-label="Secondary">
          <a href="#overview">Overview</a>
          <a href="#settings">Settings</a>
          <a href="#audit">Audit</a>
        </nav>
        <form class="form" data-expected-issue="focus-and-error-visibility">
          <label for="email">Email</label>
          <input id="email" value="review@example" />
          <label for="role">Role</label>
          <select id="role"><option>Reviewer</option></select>
          <p class="error">Enter a valid business email address.</p>
        </form>
        <section class="status-list" aria-label="Status" data-expected-issue="colour-only-status">
          <div class="status"><span class="green"></span>Ready</div>
          <div class="status"><span class="yellow"></span>Waiting</div>
          <div class="status"><span class="red"></span>Blocked</div>
        </section>
      </section>
    </main>
  </body>
</html>
