<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho Fixture: Lazy Content Page</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
      .spacer { min-height: 720px; padding: 22px; border-bottom: 1px solid #334155; }
      .lazy-box { min-height: 260px; border: 2px dashed #64748b; border-radius: 14px; display: grid; place-items: center; }
      .loaded { border-style: solid; border-color: #22c55e; background: rgba(34,197,94,0.12); }
      .marker { font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="spacer"><p>Top area before lazy content.</p></div>
    <div class="spacer">
      <div class="lazy-box" data-lazy-box>
        <p class="marker">LAZY_CONTENT_PENDING_MARKER</p>
      </div>
    </div>
    <div class="spacer"><p>Further scroll area.</p></div>
    <div class="spacer"><p id="lazyBottomMarker" class="marker">LAZY_CONTENT_BOTTOM_MARKER</p></div>
    <script>
      const target = document.querySelector('[data-lazy-box]');
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          target.classList.add('loaded');
          target.innerHTML = '<p class="marker">LAZY_CONTENT_LOADED_MARKER</p>';
          io.disconnect();
        });
      }, { rootMargin: '200px' });
      io.observe(target);
    </script>
  </body>
</html>
