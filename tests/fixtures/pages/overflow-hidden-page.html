<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olho Fixture: Overflow Hidden Page</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font: 16px/1.5 system-ui, sans-serif; }
      body { background: #020617; color: #e2e8f0; }
      .scrollbox { height: 100%; overflow-y: auto; padding: 16px; }
      .block { min-height: 380px; border: 1px solid #334155; border-radius: 12px; margin-bottom: 16px; padding: 16px; }
    </style>
  </head>
  <body>
    <div class="scrollbox">
      <div class="block"><h2>Overflow Hidden Fixture</h2><p>OLHO_OVERFLOW_MARKER_TOP</p></div>
      <div class="block"><p>Scrollable section 2</p></div>
      <div class="block"><p>Scrollable section 3</p></div>
      <div class="block"><p>OLHO_OVERFLOW_MARKER_BOTTOM</p></div>
    </div>
  </body>
</html>
