<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Figma Frame - figma.com</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #2c2c2c;
        color: #d4d4d4;
        font: 12px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .figma-shell {
        display: grid;
        grid-template-rows: 50px 1fr;
        height: 100vh;
      }

      .figma-topbar {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 16px;
        border-bottom: 1px solid #414141;
        background: #1f1f1f;
      }

      .figma-workspace {
        display: grid;
        grid-template-columns: 250px 1fr 300px;
        min-height: 0;
      }

      .figma-layers,
      .figma-properties {
        padding: 16px;
        background: #262626;
      }

      .figma-layers {
        border-right: 1px solid #414141;
      }

      .figma-properties {
        border-left: 1px solid #414141;
      }

      .layer {
        height: 28px;
        margin-bottom: 8px;
        border-radius: 6px;
        background: #333333;
      }

      .figma-canvas {
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 38px;
        background: #303030;
      }

      .figma-frame {
        width: 780px;
        min-height: 600px;
        padding: 38px;
        border-radius: 6px;
        background: #f8fafc;
        color: #1f2937;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      }

      .banner {
        display: grid;
        grid-template-columns: 1fr 180px;
        gap: 18px;
        padding: 26px;
        border-radius: 20px;
        background: #e0f2fe;
      }

      .banner h1 {
        margin: 0 0 8px;
        color: #075985;
        font-size: 26px;
      }

      .banner p {
        margin: 0;
        color: #7c8a99;
      }

      .button-row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .button {
        min-height: 38px;
        border-radius: 12px;
        padding: 0 14px;
        border: 0;
        background: #38bdf8;
        color: #0c4a6e;
        font-weight: 800;
      }

      .button.secondary {
        background: #bae6fd;
      }

      .visual {
        border-radius: 20px;
        background:
          linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(14, 165, 233, 0.8)),
          repeating-linear-gradient(90deg, #fff 0 14px, transparent 14px 28px);
      }

      .content-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 18px;
      }

      .content-card {
        min-height: 132px;
        padding: 16px;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 14px 26px rgba(14, 116, 144, 0.15);
      }
    </style>
  </head>
  <body>
    <!-- QA expected: design review should ignore Figma panels and focus on .figma-frame. -->
    <div class="figma-shell" data-review-fixture="figma-like-design">
      <div class="figma-topbar" data-expected-excluded="true">Figma toolbar / file controls / zoom</div>
      <div class="figma-workspace">
        <aside class="figma-layers" data-expected-excluded="true">
          <div class="layer"></div><div class="layer"></div><div class="layer"></div><div class="layer"></div>
        </aside>
        <main class="figma-canvas">
          <section class="figma-frame" data-expected-region="central-figma-frame">
            <section class="banner" data-expected-issue="weak-cta-integration-and-soft-copy">
              <div>
                <h1>Coordinate audits from a single workspace</h1>
                <p>
                  The body copy is visually soft, and the action row sits low enough that it feels detached from the main message.
                </p>
                <div class="button-row">
                  <button class="button" type="button">Create audit</button>
                  <button class="button secondary" type="button">Import data</button>
                </div>
              </div>
              <div class="visual" aria-label="Decorative dashboard preview"></div>
            </section>
            <section class="content-grid" data-expected-issue="card-rhythm-and-consistency">
              <article class="content-card">Summary card with a large soft shadow.</article>
              <article class="content-card">Related card using the same emphasis as the primary module.</article>
            </section>
          </section>
        </main>
        <aside class="figma-properties" data-expected-excluded="true">
          <div class="layer"></div><div class="layer"></div><div class="layer"></div><div class="layer"></div>
        </aside>
      </div>
    </div>
  </body>
</html>
