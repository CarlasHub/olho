<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA Image Only Import Source</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f8fafc;
        color: #17212b;
        font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .capture-candidate {
        width: 960px;
        margin: 40px auto;
        padding: 38px;
        border-radius: 24px;
        background: #fff7ed;
        box-shadow: 0 24px 60px rgba(30, 41, 59, 0.12);
      }

      .hero {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      h1 {
        margin: 0 0 10px;
        color: #92400e;
        font-size: 30px;
      }

      p {
        color: #9a8065;
        font-size: 14px;
      }

      .button {
        display: inline-grid;
        min-height: 36px;
        place-items: center;
        border-radius: 999px;
        padding: 0 12px;
        background: #ef4444;
        color: #ffffff;
        font-weight: 800;
      }

      .visual {
        border-radius: 24px;
        background:
          radial-gradient(circle at 50% 40%, #fca5a5, transparent 30%),
          linear-gradient(135deg, #fef3c7, #fdba74);
      }
    </style>
  </head>
  <body>
    <!-- QA expected: use this as an image-only source; reports should state DOM/focus/selector limits and not fake DOM findings. -->
    <main class="capture-candidate" data-review-fixture="image-only-import-test">
      <section class="hero" data-expected-region="image-only-design-surface">
        <div>
          <h1>Static design screenshot candidate</h1>
          <p>The design is intentionally image-like and should be reviewed with image-only limitations if imported as a screenshot.</p>
          <span class="button">Continue</span>
        </div>
        <div class="visual" aria-label="Decorative product preview"></div>
      </section>
    </main>
  </body>
</html>
