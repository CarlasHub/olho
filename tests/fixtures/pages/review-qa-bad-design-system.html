<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA Bad Design System</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #eef2f6;
        color: #1f2937;
        font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 36px;
      }

      h1 {
        margin: 0 0 24px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 13px;
        margin-bottom: 28px;
      }

      .btn-a {
        min-height: 46px;
        border: 0;
        border-radius: 8px;
        padding: 0 18px;
        background: #0f766e;
        color: white;
        font-weight: 800;
      }

      .btn-b {
        min-height: 38px;
        border: 2px dashed #2563eb;
        border-radius: 999px;
        padding: 0 24px;
        background: #dbeafe;
        color: #1d4ed8;
        font-weight: 600;
      }

      .btn-c {
        min-height: 52px;
        border: 4px solid #f59e0b;
        border-radius: 2px;
        padding: 0 14px;
        background: #fff7ed;
        color: #92400e;
        font-weight: 900;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        min-height: 240px;
        padding: 22px;
        background: #ffffff;
      }

      .card-one {
        border: 1px solid #d8dee8;
        border-radius: 8px;
        box-shadow: 0 10px 24px rgba(30, 41, 59, 0.06);
      }

      .card-two {
        border: 3px solid #c084fc;
        border-radius: 28px;
        box-shadow: 0 22px 42px rgba(126, 34, 206, 0.22);
      }

      .card-three {
        border: 0;
        border-radius: 0;
        box-shadow: inset 0 0 0 4px #f97316;
      }

      .card h2 {
        margin: 0 0 10px;
      }

      .card p {
        margin: 0 0 16px;
        color: #4b5563;
      }

      .icon-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .icon {
        display: grid;
        place-items: center;
        font-weight: 900;
      }

      .icon-a {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #ccfbf1;
        color: #0f766e;
      }

      .icon-b {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        background: #fee2e2;
        color: #b91c1c;
      }

      .icon-c {
        width: 22px;
        height: 22px;
        border: 2px solid #111827;
        background: #ffffff;
        color: #111827;
      }
    </style>
  </head>
  <body>
    <!-- QA expected: inconsistent button styles, card radii/shadows, icon treatment, spacing rhythm. -->
    <main class="shell" data-review-fixture="bad-design-system">
      <h1>Workflow command centre</h1>
      <div class="actions" data-expected-issue="inconsistent-button-styles">
        <button class="btn-a" type="button">Approve batch</button>
        <button class="btn-b" type="button">Review queue</button>
        <button class="btn-c" type="button">Archive selected</button>
      </div>
      <section class="cards" data-expected-region="component-consistency-drift">
        <article class="card card-one" data-expected-issue="inconsistent-card-styles">
          <h2>Operations</h2>
          <p>Similar card role, but a restrained treatment.</p>
          <div class="icon-row">
            <span class="icon icon-a">A</span>
            <span>Stable style</span>
          </div>
        </article>
        <article class="card card-two" data-expected-issue="inconsistent-radius-shadow">
          <h2>Finance</h2>
          <p>Same role, oversized radius and stronger shadow.</p>
          <div class="icon-row">
            <span class="icon icon-b">B</span>
            <span>Different visual language</span>
          </div>
        </article>
        <article class="card card-three" data-expected-issue="inconsistent-icon-treatment">
          <h2>Security</h2>
          <p>Same role, squared outline treatment.</p>
          <div class="icon-row">
            <span class="icon icon-c">C</span>
            <span>Third component pattern</span>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
